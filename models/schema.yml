version: 2

models:
  - name: stg_vocational_enrollment
    columns:
      - name: ags
        data_tests:
          - not_null
      - name: ags_quality_flag
        data_tests:
          - accepted_values:
              values: ['district_direct', 'municipality_rolled_up', 'invalid_ags']
              quote: true

  - name: stg_vocational_graduates
    columns:
      - name: ags
        data_tests:
          - not_null
      - name: ags_quality_flag
        data_tests:
          - accepted_values:
              values: ['district_direct', 'municipality_rolled_up', 'invalid_ags']
              quote: true
      - name: gender_code
        data_tests:
          - accepted_values:
              values: ['%TOTAL%', 'GESM', 'GESW', 'GESD']
              quote: true
      - name: gender_label
        data_tests:
          - not_null
      - name: degree_label
        data_tests:
          - not_null

  - name: stg_hospital_capacity
    columns:
      - name: ags
        data_tests:
          - not_null
      - name: ags_quality_flag
        data_tests:
          - accepted_values:
              values: ['district_direct', 'municipality_rolled_up', 'invalid_ags']
              quote: true

  - name: int_regional_supply_demand_joined
    columns:
      - name: ags
        data_tests:
          - not_null
          - unique
      - name: graduates_total
        data_tests:
          - not_null

  - name: dim_district_resilience
    columns:
      - name: risk_band
        data_tests:
          - accepted_values:
              values: ['Missing demand baseline', 'Systemic Risk', 'Watch', 'Resilient']
              quote: true

snapshots:
  - name: snp_vocational_enrollment_scd2
    columns:
      - name: dbt_valid_from
        data_tests:
          - not_null
      - name: ags
        data_tests:
          - not_null
      - name: school_type
        data_tests:
          - not_null
