name: docs-pages

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - docs/**
      - models/**
      - macros/**
      - snapshots/**
      - dbt_project.yml
      - profiles.yml.example
      - requirements.txt
      - .github/workflows/docs-pages.yml

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-docs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Build warehouse and dbt assets
        run: |
          python scripts/run_pipeline.py
          cp profiles.yml.example profiles.yml
          dbt deps --profiles-dir . || true
          dbt run --profiles-dir .
          dbt docs generate --profiles-dir .

      - name: Build static site
        run: |
          mkdir -p site/dbt
          mkdir -p site/project
          cp target/index.html site/dbt/index.html
          cp target/manifest.json site/dbt/manifest.json
          cp target/catalog.json site/dbt/catalog.json
          cp target/run_results.json site/dbt/run_results.json || true
          cp -r target/static site/dbt/static
          cp -r docs/. site/project/
          cat > site/index.html <<'HTML'
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8" />
            <meta name="viewport" content="width=device-width, initial-scale=1" />
            <title>Vocational Resilience Auditor Docs</title>
            <style>
              body { font-family: Arial, sans-serif; max-width: 900px; margin: 3rem auto; padding: 0 1rem; line-height: 1.5; }
              h1 { margin-bottom: 0.5rem; }
              ul { padding-left: 1.2rem; }
              a { text-decoration: none; }
              a:hover { text-decoration: underline; }
              .card { border: 1px solid #ddd; border-radius: 8px; padding: 1rem; margin: 1rem 0; }
            </style>
          </head>
          <body>
            <h1>Vocational Resilience Auditor Documentation</h1>
            <p>Published automatically from the main branch.</p>
            <div class="card">
              <h2>dbt Documentation</h2>
              <p>Model lineage, tests, and metadata generated by dbt.</p>
              <p><a href="./dbt/">Open dbt docs</a></p>
            </div>
            <div class="card">
              <h2>Project Documentation</h2>
              <p>Tutorials, phase notes, and capstone materials.</p>
              <p><a href="./project/">Open project docs files</a></p>
            </div>
          </body>
          </html>
          HTML

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy-pages:
    needs: build-docs
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
