name: ci

on:
  pull_request:
  push:
    branches: [master]

jobs:
  pipeline-and-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Run pipeline
        run: python scripts/run_pipeline.py

      - name: Run Ruff
        run: ruff check .

      - name: Run mypy
        run: mypy

      - name: Run unit tests with coverage gate
        run: pytest -q

      - name: dbt slim ci selection
        run: |
          cp profiles.yml.example profiles.yml
          dbt deps --profiles-dir . || true
          dbt ls --select state:modified+ --profiles-dir . --project-dir . --state target || true
